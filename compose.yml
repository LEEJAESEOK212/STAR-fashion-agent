services:
  postgres:
    image: postgres:16-alpine
    container_name: brown-chat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: brown_chat
      POSTGRES_USER: brown_chat
      POSTGRES_PASSWORD: brown_chat
    ports:
      - "5432:5432"
    volumes:
      - brown_chat_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brown_chat -d brown_chat"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  brown_chat_postgres_data:
