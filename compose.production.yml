name: brown-chat

services:
  qdrant:
    image: qdrant/qdrant:v1.19.2
    restart: unless-stopped
    volumes:
      - brown_chat_qdrant_data:/qdrant/storage
    networks:
      - internal

  embedding:
    image: vllm/vllm-openai:latest
    dns:
      - 8.8.8.8
      - 1.1.1.1
    restart: unless-stopped
    ipc: host
    command:
      - --model
      - ${EMBEDDING_MODEL:-BAAI/bge-m3}
      - --served-model-name
      - ${EMBEDDING_MODEL:-BAAI/bge-m3}
      - --runner
      - pooling
      - --gpu-memory-utilization
      - ${EMBEDDING_GPU_MEMORY_UTILIZATION:-0.1}
      - --max-model-len
      - ${EMBEDDING_MAX_MODEL_LEN:-2048}
    volumes:
      - ${HF_CACHE_DIR:-/home/ai-010/.cache/huggingface}:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - internal
      - edge

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: brown_chat
      POSTGRES_USER: brown_chat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - brown_chat_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brown_chat -d brown_chat"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  whisper:
    image: ghcr.io/ggml-org/whisper.cpp:main-arm64
    dns:
      - 8.8.8.8
      - 1.1.1.1
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ ! -s "/models/ggml-$${WHISPER_MODEL}.bin" ]; then
          /app/models/download-ggml-model.sh "$${WHISPER_MODEL}" /models
        fi
        exec /app/build/bin/whisper-server \
          --host 0.0.0.0 \
          --port 8080 \
          --model "/models/ggml-$${WHISPER_MODEL}.bin" \
          --language "$${WHISPER_LANGUAGE}" \
          --threads "$${WHISPER_THREADS}" \
          --convert
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_LANGUAGE: ${WHISPER_LANGUAGE:-ko}
      WHISPER_THREADS: ${WHISPER_THREADS:-8}
    volumes:
      - brown_chat_whisper_models:/models
    networks:
      - internal
      - edge

  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    environment:
      APP_ENV: production
      DEBUG: "false"
      API_V1_PREFIX: /api/v1
      BACKEND_CORS_ORIGINS: '["https://${DOMAIN}"]'
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      FRONTEND_URL: https://${DOMAIN}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      KAKAO_REDIRECT_URI: https://${DOMAIN}/api/v1/auth/oauth/kakao/callback
      MASTER_ACCESS_KEY_HASH: ${MASTER_ACCESS_KEY_HASH:-}
      MASTER_GUEST_COOKIE_MAX_AGE_DAYS: ${MASTER_GUEST_COOKIE_MAX_AGE_DAYS:-365}
      CHAT_API_BASE_URL: ${CHAT_API_BASE_URL:?CHAT_API_BASE_URL is required}
      CHAT_API_KEY: ${CHAT_API_KEY:-}
      CHAT_API_MODEL: ${CHAT_API_MODEL:-google/gemma-4-26B-A4B-it}
      CHAT_API_TIMEOUT_SECONDS: ${CHAT_API_TIMEOUT_SECONDS:-180}
      CHAT_API_TEMPERATURE: ${CHAT_API_TEMPERATURE:-0.7}
      CHAT_CONTEXT_MESSAGE_LIMIT: ${CHAT_CONTEXT_MESSAGE_LIMIT:-3}
      CHAT_SYSTEM_PROMPT: ${CHAT_SYSTEM_PROMPT:-당신은 Brown-Chat의 친절하고 사려 깊은 AI 어시스턴트입니다. 사용자가 다른 언어로 답해 달라고 명시적으로 요청하지 않는 한, 모든 답변은 자연스러운 한국어로만 작성하세요. 답변은 GitHub Flavored Markdown으로 작성하고 제목, 목록, 표, 인용문, 인라인 코드와 코드 블록은 내용을 더 명확하게 만들 때만 사용하세요.}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-brown_chat_turns}
      EMBEDDING_API_BASE_URL: http://embedding:8000
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      EMBEDDING_VECTOR_SIZE: ${EMBEDDING_VECTOR_SIZE:-1024}
      EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-30}
      CHAT_MEMORY_TOP_K: ${CHAT_MEMORY_TOP_K:-3}
      CHAT_MEMORY_SCORE_THRESHOLD: ${CHAT_MEMORY_SCORE_THRESHOLD:-0.0}
      UPLOAD_DIR: /app/uploads
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-10485760}
      UPLOAD_MAX_ATTACHMENTS_PER_MESSAGE: ${UPLOAD_MAX_ATTACHMENTS_PER_MESSAGE:-5}
      ATTACHMENT_TEXT_MAX_CHARACTERS: ${ATTACHMENT_TEXT_MAX_CHARACTERS:-30000}
      VLM_IMAGE_MAX_DIMENSION: ${VLM_IMAGE_MAX_DIMENSION:-2048}
      VLM_IMAGE_MAX_BYTES: ${VLM_IMAGE_MAX_BYTES:-2097152}
      VLM_IMAGE_JPEG_QUALITY: ${VLM_IMAGE_JPEG_QUALITY:-85}
      VLM_IMAGE_TEMPERATURE: ${VLM_IMAGE_TEMPERATURE:-0.2}
      WHISPER_API_BASE_URL: http://whisper:8080
      WHISPER_LANGUAGE: ${WHISPER_LANGUAGE:-ko}
      WHISPER_TIMEOUT_SECONDS: ${WHISPER_TIMEOUT_SECONDS:-120}
      VOICE_UPLOAD_MAX_BYTES: ${VOICE_UPLOAD_MAX_BYTES:-26214400}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    volumes:
      - brown_chat_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      embedding:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - internal
      - edge

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: /api/v1
    restart: unless-stopped
    environment:
      NODE_ENV: production
    depends_on:
      api:
        condition: service_healthy
    networks:
      - edge

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    networks:
      - edge

volumes:
  brown_chat_postgres_data:
  brown_chat_uploads:
  brown_chat_qdrant_data:
  brown_chat_whisper_models:
  caddy_data:
  caddy_config:

networks:
  internal:
    internal: true
  edge:
